[package]
name = "timegather"
description = "timing lines of code for benchmarking"
version = "0.2.0"
edition = "2021"
authors = ["griccardos"]
repository = "https://github.com/griccardos/timegather"
readme = "readme.md"
keywords = ["benchmark", "timing", "time", "clock", "profiling"]
categories = ["development_tools", "testing", "profiling"]

#library
[lib]
path = "src/lib.rs"


[dependencies]
indexmap = "2.14"
rand = "0.10"

[dev-dependencies]
rayon = "1"
tokio = { version = "1", features = ["full"] }
